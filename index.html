<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeshiPolli.com - 域名出售</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 90%;
            max-width: 700px;
            background: #fff;
            padding: 60px 30px;
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .domain {
            font-size: 42px;
            font-weight: 700;
            color: #111;
            margin-bottom: 25px;
        }
        .title {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .description {
            font-size: 18px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .contact {
            display: inline-block;
            padding: 14px 28px;
            background: #111;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
            transition: 0.2s;
        }
        .contact:hover {
            background: #333;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 35px;
            font-size: 14px;
            color: #999;
        }
        @media (max-width: 600px) {
            .domain { font-size: 30px; }
            .title { font-size: 24px; }
            .description { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="domain">deshipolli.com</div>
        <div class="title">此域名正在出售</div>
        <div class="description">
            这个优质域名正在出售。<br>
            如果您对购买此域名感兴趣，请点击下方按钮。
        </div>
        <a
            href="https://www.namecheap.com/domains/registration/results/?domain=deshipolli.com"
            class="contact"
            target="_blank"
            rel="noopener noreferrer"
        >立即购买</a>
        <div class="footer">域名所有者 · 欢迎咨询</div>
    </div>
</body>
</html>
